name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Check syntax
      run: |
        Rscript -e 'for (f in list.files(pattern = "\\.R$", recursive = TRUE)) { tryCatch(parse(f), error = function(e) { cat("Error in", f, ":", e$message, "\n"); quit(status = 1) }) }'
